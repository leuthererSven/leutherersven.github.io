<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Fotografie & DigiArt</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f1115;
            color: #e0e6ed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 2.2rem;
            color: #ffffff;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #8892b0;
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .filter-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0 40px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid #232a36;
            color: #8892b0;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: #232a36;
            color: #64ffda;
            border-color: #64ffda;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .gallery-item {
            background-color: #171c24;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #232a36;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            border-color: #64ffda;
        }

        .gallery-item img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
        }

        .caption {
            padding: 15px;
            font-size: 0.9rem;
            color: #a8b2d1;
            text-align: center;
        }

        .gallery-item.hide {
            display: none;
        }

        footer {
            text-align: center;
            padding: 50px 0 20px;
            color: #4a5568;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Portfolio</h1>
        <p class="subtitle">Fotografie & DigiArt</p>
    </header>

    <nav class="filter-nav">
        <button class="filter-btn active" onclick="filterGallery('all')">Alle Werke</button>
        <button class="filter-btn" onclick="filterGallery('sw')">Schwarz-Weiß</button>
        <button class="filter-btn" onclick="filterGallery('foto')">Fotografie</button>
        <button class="filter-btn" onclick="filterGallery('digiart')">DigiArt</button>
    </nav>

    <main class="gallery-grid">
        <div class="gallery-item sw">
            <img src="1787237775557.jpg" alt="Schwarz-Weiß">
            <div class="caption">Schwarz-Weiß Aufnahme</div>
        </div>

        <div class="gallery-item digiart">
            <img src="fb_img_1787219312944.jpg" alt="DigiArt">
            <div class="caption">DigiArt Werk</div>
        </div>
    </main>

    <footer>
        <p>&copy; Portfolio – Erstellt mit GitHub Pages</p>
    </footer>

    <script>
        function filterGallery(category) {
            const items = document.querySelectorAll('.gallery-item');
            const buttons = document.querySelectorAll('.filter-btn');

            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            items.forEach(item => {
                if (category === 'all' || item.classList.contains(category)) {
                    item.classList.remove('hide');
                } else {
                    item.classList.add('hide');
                }
            });
        }

        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => {
                        document.location.href = "/admin/";
                    });
                }
            });
        }
    </script>

</body>
</html>
