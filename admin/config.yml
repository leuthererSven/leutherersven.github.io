backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "gallery"
    label: "Galerie-Bilder"
    folder: "content/gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Titel", name: "title", widget: "string"}
      - {label: "Album", name: "category", widget: "select", options: ["sw", "foto", "digiart"]}
      - {label: "Bild", name: "image", widget: "image"}
